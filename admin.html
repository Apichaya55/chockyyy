<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — chockyyy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Table styling for this page only */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      background: var(--paper);
    }
    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }
    #ordersTable thead th {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 500;
      white-space: nowrap;
      border-bottom: 1px solid var(--accent);
    }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover { background: var(--cream); }
    #ordersTable td { overflow-wrap: anywhere; }
    #ordersTable td:first-child { white-space: nowrap; color: var(--brown-soft); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">chockyyy</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>รายการสั่งซื้อ</h1>
          <span class="accent-rule"></span>
          <p class="muted">เรียงจากรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
